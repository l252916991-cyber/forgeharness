name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: uv sync --extra dev --extra cli --extra platform --extra benchmark --extra frameworks --extra postgres-test --frozen
      - run: make gate
  frameworks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: make framework-check
  release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: uv sync --extra dev --extra cli --extra platform --extra benchmark --extra frameworks --extra postgres-test --frozen
      - run: uv run --no-sync python -m benchmarks.comparison.verify --candidate-dir reports/ci-candidate --freeze-only
      - run: uv run --no-sync python -m benchmarks.comparison.verify --candidate-dir reports/ci-candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: framework-candidate-verification
          path: |
            reports/ci-candidate/source.json
            reports/ci-candidate/verification/summary.json
            reports/ci-candidate/verification/runs/
