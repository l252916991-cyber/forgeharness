[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Pin the package index in-repo so lockfile resolution is identical across
# machines and CI; a user-level mirror must not change resolved artifacts.
[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true

[project]
name = "forgeharness"
version = "0.1.0"
description = "An evaluation-first Agent Harness with a software-engineering vertical agent"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "ForgeHarness contributors" }]
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "python-multipart>=0.0.20,<1",
  "pillow>=12,<13",
  "pypdf>=6,<7",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
platform = [
  "arq>=0.26,<1",
  "asyncpg>=0.30,<1",
  "qdrant-client>=1.15,<2",
  "redis>=5,<6",
]

frameworks = [
  "langchain>=1,<2",
  "langchain-core>=1,<2",
  "langchain-openai>=1,<2",
  "langgraph>=1,<2",
  "llama-index-core>=0.14,<1",
]

benchmark = ["locust>=2.40,<3"]

dev = [
  "mypy>=1.17,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.25,<5",
  "types-pyyaml>=6.0,<7",
]

[project.scripts]
forge = "forgeharness.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/forgeharness"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Offline experiment runners under benchmarks/ and evals/ are sequential by
# design: blocking file I/O and subprocess calls keep the scripts simple and
# reproducible. The library code under src/ has no such exemption.
"benchmarks/*" = ["ASYNC230", "ASYNC240", "ASYNC221"]
"evals/*" = ["ASYNC230", "ASYNC240"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["forgeharness"]

[tool.coverage.run]
branch = true
source = ["forgeharness"]

[tool.coverage.report]
fail_under = 85
show_missing = true
