[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgeharness"
version = "0.1.0"
description = "An evaluation-first Agent Harness with a software-engineering vertical agent"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "ForgeHarness contributors" }]
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.25,<5",
  "types-pyyaml>=6.0,<7",
]

[project.scripts]
forge = "forgeharness.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/forgeharness"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["forgeharness"]

[tool.coverage.run]
branch = true
source = ["forgeharness"]

[tool.coverage.report]
fail_under = 85
show_missing = true
