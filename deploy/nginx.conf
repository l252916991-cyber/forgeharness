events {}
http {
  upstream forgeharness_api {
    least_conn;
    server host.docker.internal:8001 max_fails=2 fail_timeout=5s;
    server host.docker.internal:8002 max_fails=2 fail_timeout=5s;
  }
  server {
    listen 8080;
    client_max_body_size 11m;
    location / {
      proxy_pass http://forgeharness_api;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 2s;
      proxy_read_timeout 180s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
    }
  }
}
